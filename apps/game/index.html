<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>minstrel</title>
    <link rel="stylesheet" href="/src/style.css" />
  </head>
  <body>
    <main>
      <canvas id="gl"></canvas>
      <div id="overlay"></div>
      <canvas id="minimap" width="256" height="192" hidden></canvas>
      <div id="equip" hidden>
        <canvas id="equip-top" width="256" height="192"></canvas>
        <canvas id="equip-bottom" width="256" height="192"></canvas>
      </div>
      <div id="start">
        <h1>minstrel</h1>
        <p>
          Reads a village out of your own Nintendo DS cartridge dump and lets you walk it. The
          cartridge is read on this machine and never uploaded. Confessing at the church keeps
          your progress in this browser.
        </p>
        <label id="resume-row" hidden
          ><input type="checkbox" id="resume" checked /> <span>Carry on from the last confession</span></label
        >
        <input type="file" id="file" accept=".nds" />
        <p class="hint">Drop a dump anywhere on this page, or choose one.</p>
      </div>
      <div id="talk" hidden></div>
      <div id="menu" hidden></div>
      <div id="status" class="status"></div>
    </main>
    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
